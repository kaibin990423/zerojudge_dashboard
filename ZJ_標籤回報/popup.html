<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 380px; font-family: sans-serif; padding: 12px; background: #f4f6f9; margin: 0; }
        .card { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 12px; }
        h4 { margin: 0 0 8px 0; color: #333; font-size: 0.95rem; }
        #title-display { color: #007bff; font-weight: bold; font-size: 0.9rem; }
        
        /* 標籤按鈕區樣式 */
        .tag-container { display: flex; flex-wrap: wrap; gap: 6px; max-height: 100px; overflow-y: auto; padding: 4px 0; }
        .tag-btn { background: #e9ecef; border: 1px solid #ced4da; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; user-select: none; }
        .tag-btn:hover { background: #dee2e6; }
        .tag-btn.selected { background: #28a745; color: white; border-color: #28a745; font-weight: bold; }
        
        iframe { border: none; background: white; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

    <div class="card">
        <h4>目前偵測題目</h4>
        <div id="title-display">讀取中...</div>
    </div>

    <div class="card">
        <h4>快速選擇既有標籤（點擊加入）</h4>
        <div class="tag-container" id="tag-box">載入雲端標籤中...</div>
    </div>
    
    <iframe id="gform" width="100%" height="400" src=""></iframe>

    <script src="popup.js"></script>
</body>
</html>
